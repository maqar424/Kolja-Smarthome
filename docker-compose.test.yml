# Throwaway MQTT broker for integration tests on the dev VM (never the Pi).
#   docker compose -f docker-compose.test.yml up -d
#   pytest
#   docker compose -f docker-compose.test.yml down
services:
  test-mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: kolja-smarthome-test-mosquitto
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - "127.0.0.1:18830:1883"
